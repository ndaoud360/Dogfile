[workspace]
resolver = "2"
members = ["core", "backend", "devserver", "app"]
default-members = ["core", "backend", "devserver", "app"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
# unwind, not abort: a bug that panics inside one command or background job is caught (http.rs, ops.rs) and reported
# as an error, instead of closing the whole app with every window and copy in it; crash.log still records it
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

# drag crate with Explorer-style drop effects (copy, move or link, chosen by the drop target)
[patch.crates-io]
drag = { path = "vendor/crates/drag" }
