# llama.cpp (the assistant's model) is compiled with the x86 speed-ups that nearly every PC since 2015 has (AVX2, FMA,
# F16C). Without them it runs 10-20x slower. llm::cpu_ok() keeps it off on older processors. ggml ignores these on ARM.
[env]
GGML_AVX = "ON"
GGML_AVX2 = "ON"
GGML_FMA = "ON"
GGML_F16C = "ON"
GGML_BMI2 = "ON"
LLAMA_STATIC_CRT = "1"

# The Visual C++ runtime (VCRUNTIME140.dll, MSVCP140.dll…) is linked into Dogfile.exe on Windows, so nothing has to be
# installed beside it and the Microsoft Store doesn't find an undeclared dependency ("MSVCP140.DLL was not found").
# llama.cpp (C++) is compiled the same way (LLAMA_STATIC_CRT); the C++ code of other crates follows crt-static by itself.
# build/ci/check-deps.mjs lists what each program still needs from outside, and CI fails when it isn't only Windows.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]
