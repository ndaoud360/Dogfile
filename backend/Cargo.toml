[package]
name = "dogfile-backend"
version = "2.2.0"
edition = "2024"

[dependencies]
dogfile-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
http = "1"
notify = "8"
regex = "1"
fancy-regex = "0.14"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
ed25519-dalek = "2"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
trash = "5"
arboard = { version = "3", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "exr", "hdr", "tiff", "bmp", "ico", "pnm", "qoi", "webp", "gif", "ff"] }
psd = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
image_dds = { version = "0.7", default-features = false, features = ["ddsfile", "image"] }
portable-pty = "0.9"
dirs = "6"
rand = "0.9"
parking_lot = "0.12"
once_cell = "1"
urlencoding = "2"
filetime = "0.2"
russh = { version = "0.54", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "2"
async-trait = "0.1"
suppaftp = { version = "6", features = ["rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
# the assistant's language model (llama.cpp, built in; no GPU backend yet)
llama-cpp-2 = { version = "0.1.160", default-features = false, features = ["common"], optional = true }
llama-cpp-sys-2 = { version = "0.1.160", default-features = false, features = ["common"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem",
  "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security_Cryptography",
  "Win32_System_RestartManager", "Win32_System_Threading", "Win32_Graphics_Dwm", "Win32_System_Variant",
  "Win32_System_Registry", "Win32_UI_Controls", "Win32_System_Ioctl", "Win32_System_IO", "Win32_NetworkManagement_WNet",
  "Win32_System_SystemServices", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Time", "Win32_Storage_EnhancedStorage", "Win32_System_Diagnostics_Debug", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Power",
  # document reminders: text recognition, PDF pages, notifications (all built into Windows)
  "Foundation", "Foundation_Collections", "Storage", "Storage_Streams", "Graphics_Imaging", "Media_Ocr", "Data_Pdf", "Data_Xml_Dom", "UI_Notifications", "Globalization",
] }
winreg = "0.55"
clipboard-win = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# the assistant's language model (llama.cpp); off for builds where it doesn't compile yet (Windows on ARM)
default = ["llm"]
llm = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]

[[example]]
name = "brain_eval"
required-features = ["llm"]
