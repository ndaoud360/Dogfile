# Builds Dogfile (Tauri + Rust) for Windows, runs the engine's tests, starts the app once on the runner to
# check that it draws and to measure its memory, and publishes Dogfile.exe on the app-bin branch.
# Results go into annotations (readable through the API).
name: app
on:
  push:
    branches: [main]
    paths: ['core/**', 'backend/**', 'app/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/app.yml', 'src/renderer/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: app-${{ hashFiles('Cargo.lock') }}
          restore-keys: app-
      - name: Build
        shell: pwsh
        run: |
          cargo build --release -p dogfile --message-format=short 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errs = (Get-Content build.log | Select-String -Pattern '(^|: )error' | Select-Object -First 80) -join '%0A'
            Write-Output "::error title=build::$errs"
            $tail = (Get-Content build.log | Select-Object -Last 40) -join '%0A'
            Write-Output "::error title=build-tail::$tail"
          } else {
            $warn = (Get-Content build.log | Select-String -Pattern 'warning' | Select-Object -First 40) -join '%0A'
            Write-Output "::notice title=build-warnings::$warn"
          }
          exit $code
      - name: Engine tests
        shell: pwsh
        run: |
          cargo test --release -p dogfile-core 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          $tail = (Get-Content test.log | Select-Object -Last 40) -join '%0A'
          if ($code -ne 0) { Write-Output "::error title=tests::$tail" } else { Write-Output "::notice title=tests::$((Get-Content test.log | Select-String 'test result') -join '%0A')" }
          exit $code
      - name: Start the app, take screenshots, measure memory (and the old Electron version for comparison)
        shell: pwsh
        continue-on-error: true
        run: |
          trap { Write-Output "::error title=smoke::$($_.InvocationInfo.PositionMessage -replace "`n",'%0A') $_"; continue }
          Remove-Item -Recurse -Force target/release/renderer, target/release/data, target/release/portable.txt -ErrorAction SilentlyContinue
          $out = "$env:RUNNER_TEMP/smoke"; New-Item -ItemType Directory -Force $out | Out-Null
          $files = "$env:RUNNER_TEMP\files"; New-Item -ItemType Directory -Force $files | Out-Null
          1..300 | ForEach-Object { Set-Content "$files/file $_.txt" "hello $_" }
          Copy-Item -Recurse src/renderer target/release/renderer
          New-Item -ItemType File -Force target/release/portable.txt | Out-Null
          $noIndex = '{"indexEnabled":false,"welcomed":true,"uiMode":"simple"}'
          # Dogfile 2 without the index
          New-Item -ItemType Directory -Force target/release/data | Out-Null
          Set-Content target/release/data/settings.json $noIndex
          ./build/ci/measure.ps1 -Exe target/release/dogfile.exe -ArgList "`"$files`"" -Label tauri-noindex -Out $out -Shot
          # Dogfile 2 with the index (the default)
          Remove-Item -Recurse -Force target/release/data
          ./build/ci/measure.ps1 -Exe target/release/dogfile.exe -ArgList "`"$files`"" -Label tauri-index -Out $out -Seconds 40
          # ...and after a couple of quiet minutes (the index sleeps when nobody searches)
          ./build/ci/measure.ps1 -Exe target/release/dogfile.exe -ArgList "`"$files`"" -Label tauri-index-idle -Out $out -Seconds 150 -Shot
          # Dogfile 1.6 (Electron) without the index, same folder and settings
          npm install --no-save --ignore-scripts electron@33.4.11 2>&1 | Out-Null
          node node_modules/electron/install.js 2>&1 | Out-Null
          $el = "node_modules/electron/dist/electron.exe"
          if (Test-Path $el) {
            New-Item -ItemType Directory -Force node_modules/electron/dist/data | Out-Null
            Set-Content node_modules/electron/dist/data/settings.json $noIndex
            $env:ATLAS_PORTABLE = '1'
            ./build/ci/measure.ps1 -Exe $el -ArgList ". `"$files`"" -Label electron-noindex -Out $out -Shot
          } else { Write-Output "::warning title=electron::not installed" }
      - name: Windows checks inside the app (shell, recycle bin, clipboard, thumbnails, 7-Zip, terminal…)
        shell: pwsh
        continue-on-error: true
        run: |
          trap { Write-Output "::error title=wintest::$_"; continue }
          $out = "$env:RUNNER_TEMP/smoke"; New-Item -ItemType Directory -Force $out | Out-Null
          Remove-Item -Recurse -Force target/release/data -ErrorAction SilentlyContinue
          if (-not (Test-Path target/release/renderer)) { Copy-Item -Recurse src/renderer target/release/renderer }
          New-Item -ItemType File -Force target/release/portable.txt | Out-Null
          New-Item -ItemType Directory -Force target/release/data, target/release/7zip | Out-Null
          Copy-Item vendor/7zip/win32/7za.exe target/release/7zip/
          Set-Content target/release/data/settings.json '{"welcomed":true}'
          $js = Get-Content -Raw build/ci/wintest.js
          $env:ATLAS_TEST = '1'
          $env:DOGFILE_TEST_LOG = "$out/wintest.log"
          $env:ATLAS_STEPS = (ConvertTo-Json -Compress -Depth 3 @(@{ js = $js; wait = 90000; shot = "$out/wintest.png" }))
          $p = Start-Process -FilePath target/release/dogfile.exe -PassThru
          if (-not $p.WaitForExit(150000)) { Stop-Process -Id $p.Id -Force; Write-Output "::warning title=wintest::timed out" }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          $log = if (Test-Path "$out/wintest.log") { Get-Content "$out/wintest.log" } else { @('no log') }
          Write-Output "::notice title=wintest::$($log -join '%0A')"
          Remove-Item Env:ATLAS_TEST, Env:DOGFILE_TEST_LOG, Env:ATLAS_STEPS
      - name: Publish to the app-bin branch (readable with git)
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP/binbranch"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/dogfile.exe $d/Dogfile.exe
          if (Test-Path "$env:RUNNER_TEMP/smoke") { Copy-Item "$env:RUNNER_TEMP/smoke/*" $d/ }
          Set-Location $d
          git init -q -b app-bin
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Dogfile.exe from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-bin
      - name: Tidy the cache
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force target/release/renderer, target/release/data, target/release/portable.txt -ErrorAction SilentlyContinue
