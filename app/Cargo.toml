[package]
name = "dogfile"
version = "2.2.0"
edition = "2024"
description = "Dogfile file manager"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dogfile-backend = { path = "../backend" }
dogfile-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = "1"
parking_lot = "0.12"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
urlencoding = "2"
dirs = "6"
serde = "1"
drag = "2"
tauri-plugin-single-instance = "2"
tauri-runtime = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls"] }
winreg = "0.55"
webview2-com = "0.39"
windows-core = "0.62"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
