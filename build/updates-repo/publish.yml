# Publishes an update: the files pushed to the `outbox` branch (latest.json + packages) become a GitHub release,
# marked latest, so installed copies of Dogfile find it at releases/latest/download/latest.json.
# Versions with a dash (2.1.0-beta) become pre-releases, which installed copies ignore.
name: publish
on:
  push:
    branches: [outbox]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: outbox
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ver=$(jq -r .version latest.json)
          jq -r .notes latest.json > "$RUNNER_TEMP/notes.md"
          files=$(ls | grep -v -e '^README' -e '^\.github$')
          flags="--latest"
          case "$ver" in *-*) flags="--prerelease --latest=false" ;; esac
          if gh release view "v$ver" > /dev/null 2>&1; then
            gh release upload "v$ver" $files --clobber
          else
            gh release create "v$ver" $files --target main --title "Dogfile $ver" --notes-file "$RUNNER_TEMP/notes.md" $flags
          fi
          echo "::notice title=published::Dogfile $ver: $(echo $files)"
